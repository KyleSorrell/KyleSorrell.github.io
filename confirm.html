<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Request - Jake Sorrell Flight Lessons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>(function(){ emailjs.init("IA_nnwX8_TyVgF09H"); })();</script>
  <style>
    .confirm-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px;
      background-color: #f5f5f5;
      border-radius: 4px;
      text-align: center;
    }

    .confirm-container h2 {
      margin-bottom: 20px;
    }

    .lesson-details {
      background-color: #fff;
      padding: 20px;
      border-radius: 4px;
      margin: 20px 0;
      text-align: left;
    }

    .lesson-details p {
      margin: 10px 0;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }

    .confirm-btn {
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .confirm-btn.yes {
      background-color: #469fd4;
      color: #fff;
    }

    .confirm-btn.yes:hover {
      background-color: #3a7fa8;
    }

    .confirm-btn.no {
      background-color: #ccc;
      color: #000;
    }

    .confirm-btn.no:hover {
      background-color: #aaa;
    }

    .status-message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.loading {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Jake Sorrell</a>
    </div>
  </nav>

  <div class="confirm-container">
    <h2>Lesson Request Review</h2>

    <div id="lessonDetails" class="lesson-details" style="display: none;">
      <p><strong>Client Name:</strong> <span id="clientName"></span></p>
      <p><strong>Client Email:</strong> <span id="clientEmail"></span></p>
      <p><strong>Date:</strong> <span id="lessonDate"></span></p>
      <p><strong>Time:</strong> <span id="lessonTime"></span></p>
      <p><strong>Aircraft Tail Number:</strong> <span id="tailNumber"></span></p>
    </div>

    <div id="loadingMessage" class="status-message loading" style="display: block;">
      Loading lesson details…
    </div>

    <div id="errorMessage" class="status-message error" style="display: none;"></div>

    <div id="confirmSection" style="display: none;">
      <p>Do you want to confirm this lesson?</p>
      <div class="button-group">
        <button class="confirm-btn yes" onclick="confirmLesson()">Confirm Lesson</button>
        <button class="confirm-btn no" onclick="denyLesson()">Deny Request</button>
      </div>
    </div>

    <div id="resultMessage" class="status-message" style="display: none;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get("id");
    const action = urlParams.get("action");

    async function loadLessonDetails() {
      if (!requestId) {
        showError("No lesson request ID provided");
        return;
      }

      try {
        const response = await fetch(
          `https://us-central1-jake-sorrell-flight-lessons.cloudfunctions.net/getLessonRequest?id=${encodeURIComponent(requestId)}`
        );

        if (!response.ok) {
          throw new Error("Lesson request not found");
        }

        const data = await response.json();

        document.getElementById("clientName").textContent = data.full_name;
        document.getElementById("clientEmail").textContent = data.email;
        document.getElementById("lessonDate").textContent = data.lesson_date;
        document.getElementById("lessonTime").textContent = data.time_slot;
        document.getElementById("tailNumber").textContent = data.tail_number;

        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("lessonDetails").style.display = "block";
        document.getElementById("confirmSection").style.display = "block";
      } catch (error) {
        showError("Error loading lesson details: " + error.message);
      }
    }

    async function confirmLesson() {
      await processDecision("confirm");
    }

    async function denyLesson() {
      await processDecision("deny");
    }

    async function processDecision(decision) {
      const confirmSection = document.getElementById("confirmSection");
      confirmSection.style.display = "none";

      const resultDiv = document.getElementById("resultMessage");
      resultDiv.textContent = "Processing...";
      resultDiv.classList.remove("error");
      resultDiv.classList.add("loading");
      resultDiv.style.display = "block";

      try {
        const response = await fetch(
          "https://us-central1-jake-sorrell-flight-lessons.cloudfunctions.net/processLessonDecision",
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              requestId: requestId,
              action: decision,
            }),
          }
        );

        if (!response.ok) {
          throw new Error("Failed to process decision");
        }

        const result = await response.json();

        // Send result email to student via EmailJS (client-side)
        const resultMessage = decision === "confirm"
          ? "Your flight lesson has been confirmed! See you soon."
          : "Unfortunately, this time slot is no longer available. Please visit the website to book another time.";

        await emailjs.send("service_qjt49i4", "template_c1jb6qq", {
          name: result.student.full_name,
          time: `${result.student.lesson_date} at ${result.student.time_slot}`,
          full_name: result.student.full_name,
          email: result.student.email,
          lesson_date: result.student.lesson_date,
          time_slot: result.student.time_slot,
          tail_number: result.student.tail_number,
          result_message: resultMessage,
        });

        resultDiv.textContent =
          decision === "confirm"
            ? "✓ Lesson confirmed! Confirmation email sent to client."
            : "✓ Lesson request denied. Notification sent to client.";
        resultDiv.classList.remove("loading");
        resultDiv.classList.add("success");
      } catch (error) {
        showError("Error processing decision: " + error.message);
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById("errorMessage");
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
      document.getElementById("loadingMessage").style.display = "none";
      document.getElementById("lessonDetails").style.display = "none";
      document.getElementById("confirmSection").style.display = "none";
    }

    // Load details when page loads
    document.addEventListener("DOMContentLoaded", loadLessonDetails);
  </script>
</body>
</html>
